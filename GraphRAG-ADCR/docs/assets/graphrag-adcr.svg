<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">GraphRAG-ADCR 方法流程</title>
<desc id="desc">文书解析、知识抽取、Neo4j 建图、关键词与语义混合检索、回答生成、效果评估。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#94a3b8" stroke-width="2"/></marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    .card { fill:#fff; stroke:#dbe3ee; stroke-width:1.5; }
    .heading { fill:#172554; font-size:22px; font-weight:650; }
    .detail { fill:#64748b; font-size:16px; }
    .step { fill:#2563eb; font-size:14px; font-weight:700; }
    .link { fill:none; stroke:#94a3b8; stroke-width:2; marker-end:url(#arrow); }
  </style>
</defs>
<rect x="1" y="1" width="1198" height="458" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="48" y="49" fill="#0f172a" font-size="23" font-weight="700">GraphRAG-ADCR</text>
<text x="48" y="77" class="detail">知识图谱与混合检索驱动的法律因果推理</text>

<path d="M366 166 H430" class="link"/><path d="M742 166 H806" class="link"/>
<path d="M958 222 V248 H206 V282" class="link"/>
<path d="M366 338 H430" class="link"/><path d="M742 338 H806" class="link"/>

<g transform="translate(48 110)">
  <rect width="318" height="112" rx="13" class="card"/>
  <text x="22" y="27" class="step">01 / DOCUMENTS</text>
  <text x="22" y="58" class="heading">文书解析</text>
  <text x="22" y="88" class="detail">DOCX 段落与表格 · 完整正文</text>
</g>
<g transform="translate(430 110)">
  <rect width="312" height="112" rx="13" class="card"/>
  <text x="22" y="27" class="step">02 / EXTRACTION</text>
  <text x="22" y="58" class="heading">知识抽取</text>
  <text x="22" y="88" class="detail">实体与关系 · 带证据的因果路径</text>
</g>
<g transform="translate(806 110)">
  <rect width="346" height="112" rx="13" class="card"/>
  <text x="22" y="27" class="step">03 / KNOWLEDGE GRAPH</text>
  <text x="22" y="58" class="heading">Neo4j 建图</text>
  <text x="22" y="88" class="detail">案件知识 · 来源文书 · 路径证据</text>
</g>
<g transform="translate(48 282)">
  <rect width="318" height="112" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="22" y="27" class="step">04 / HYBRID RETRIEVAL</text>
  <text x="22" y="58" class="heading">混合检索</text>
  <text x="22" y="88" class="detail">BM25 + 语义向量 · RRF 排序</text>
</g>
<g transform="translate(430 282)">
  <rect width="312" height="112" rx="13" class="card"/>
  <text x="22" y="27" class="step">05 / GENERATION</text>
  <text x="22" y="58" class="heading">回答生成</text>
